<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Porirua Locality — Map Preview</title>
  <meta name="description" content="Preview of a community map for the Porirua Locality site (Te Wāhi Tiaki Tātou)." />

  <!-- Leaflet (mapping library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PapaParse (CSV parser for Google Sheets) -->
  <script defer src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --fg: #1a3d2a;
      --muted: #6b7280;
      --bg: #fafaf7;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 960px; margin: 32px auto 16px; padding: 0 20px; }
    header h1 { margin: 0 0 4px; font-size: 22px; color: var(--fg); }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    main { max-width: 960px; margin: 0 auto 32px; padding: 0 20px; }
    #map { height: 560px; width: 100%; border: 1px solid var(--border); border-radius: 12px; background: #eef2ee; }
    .status { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; color: #374151; }
    .legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }
    footer { max-width: 960px; margin: 24px auto 48px; padding: 0 20px; color: var(--muted); font-size: 12px; }
    footer code { background: #eef2ee; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Porirua Locality — Map Preview</h1>
    <p>Pins load from a Google Sheet (or fall back to sample data). Edit <code>config.js</code> to point at your sheet.</p>
  </header>

  <main>
    <div id="map" aria-label="Map of Porirua community initiatives"></div>
    <div class="status" id="status">Loading map…</div>
    <div class="legend" id="legend"></div>
  </main>

  <footer>
    Tiles © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ·
    Built with <a href="https://leafletjs.com/">Leaflet</a> ·
    Source of truth: Google Sheet
  </footer>

  <script src="config.js"></script>
  <script src="map.js"></script>
</body>
</html>
