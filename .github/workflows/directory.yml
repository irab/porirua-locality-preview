name: Porirua directory

on:
  push:
    branches: [main]
    paths:
      - "porirua_directory/**"
      - ".github/workflows/directory.yml"
  pull_request:
    paths:
      - "porirua_directory/**"
      - ".github/workflows/directory.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/irab/porirua-directory
  IMAGE_API: ghcr.io/irab/porirua-directory-api
  IMAGE_SYNC: ghcr.io/irab/porirua-directory-sync
  IMAGE_OPERATIONS: ghcr.io/irab/porirua-directory-operations
  IMAGE_DIRECTUS: ghcr.io/irab/porirua-directory-directus
  IMAGE_PAYLOAD: ghcr.io/irab/porirua-directory-payload

defaults:
  run:
    working-directory: porirua_directory

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: porirua_directory/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: porirua_directory/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # Dev tenant images from a branch. Does not run on push to main.
  # Trigger: gh workflow run directory.yml --ref <branch>
  image-dev:
    if: github.event_name == 'workflow_dispatch'
    needs: [unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          file: ./porirua_directory/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_API }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          file: ./porirua_directory/Dockerfile.sync
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_SYNC }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          file: ./porirua_directory/Dockerfile.operations
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_OPERATIONS }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          file: ./porirua_directory/Dockerfile.directus
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_DIRECTUS }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./porirua_directory
          file: ./porirua_directory/Dockerfile.payload
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PAYLOAD }}:${{ github.sha }}
