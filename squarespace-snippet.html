<!--
  Drop-in Squarespace Code Block for the Porirua Locality events view,
  grouped by Porirua Assembly Recommendation themes.

  This snippet is designed to inherit the site's own palette + fonts
  (via the site's `:root` CSS variables like --black-hsl and --accent-hsl,
  plus the site's body/heading font-families). It therefore looks native
  on the Porirua Locality Squarespace site without any further styling.

  How to use:
  1. In Squarespace, edit the target page and add a "Code" block (Business plan+).
  2. Paste this whole snippet in.
  3. Replace GOOGLE_SHEET_CSV_URL with your Sheet's "Publish to web -> CSV" URL.

  Expected sheet columns (first row = headers):
    name, theme, subtheme, date, time, venue, address, lat, lng, url, description
  `theme` must match one of the theme ids below.
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  /* The Porirua Locality site already defines --black-hsl (plum),
     --darkAccent-hsl (crimson), --lightAccent-hsl (dusty blush) and
     --accent-hsl (cream) on :root. We reuse those so this snippet
     re-skins automatically if the site's palette is ever changed. */
  .pal-root {
    --pal-ink: hsla(var(--black-hsl, 316,63%,23%), 1);
    --pal-ink-soft: hsla(var(--black-hsl, 316,63%,23%), 0.82);
    --pal-muted: hsla(var(--black-hsl, 316,63%,23%), 0.6);
    --pal-border: hsla(var(--lightAccent-hsl, 7,75%,84%), 0.6);
    --pal-border-strong: hsla(var(--lightAccent-hsl, 7,75%,84%), 1);
    --pal-surface: #fff;
    --pal-hover: hsla(var(--accent-hsl, 5,75%,97%), 1);
    --pal-accent: hsla(var(--darkAccent-hsl, 358,73%,47%), 1);
    color: var(--pal-ink);
    /* Inherit the site's body font automatically. */
  }
  .pal-root h2, .pal-root h3, .pal-root .pal-title, .pal-root .pal-day {
    /* Inherits the site's Recoleta heading font. */
    font-family: inherit;
    color: var(--pal-ink);
  }
  .pal-map {
    height: 480px; width: 100%;
    border: 1px solid var(--pal-border);
    border-radius: 16px;
    background: #eceae5;
    box-shadow: 0 4px 18px -8px hsla(var(--black-hsl, 316,63%,23%), 0.15);
  }
  .pal-status { font-size: 12px; color: var(--pal-muted); margin-top: 10px; }
  .pal-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 6px; }
  .pal-nav button {
    background: var(--pal-surface);
    border: 1px solid var(--pal-border-strong);
    border-radius: 999px;
    padding: 7px 14px; font-size: 12px; font-weight: 500;
    color: var(--pal-ink); cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background 120ms, border-color 120ms;
  }
  .pal-nav button:hover { background: var(--pal-hover); border-color: var(--pal-ink); }
  .pal-nav .pal-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }

  .pal-themes { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
  .pal-card {
    background: var(--pal-surface);
    border: 1px solid var(--pal-border);
    border-radius: 18px;
    overflow: hidden;
    scroll-margin-top: 20px;
    box-shadow: 0 2px 12px -6px hsla(var(--black-hsl, 316,63%,23%), 0.08);
  }
  .pal-head { padding: 20px 22px 18px; border-left: 6px solid var(--pal-ink); position: relative; }
  .pal-head h3 { margin: 0; font-size: 22px; line-height: 1.2; color: var(--pal-ink); }
  .pal-head .pal-sub { margin: 4px 0 0; color: var(--pal-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .pal-head p { margin: 12px 0 0; color: var(--pal-ink-soft); font-size: 14px; line-height: 1.55; }
  .pal-head .pal-count { position: absolute; top: 22px; right: 22px; font-size: 12px; color: var(--pal-muted); font-weight: 500; }

  .pal-events { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pal-border); }
  .pal-events.pal-empty li { padding: 18px 22px; font-size: 13px; color: var(--pal-muted); font-style: italic; }
  .pal-events li {
    padding: 14px 22px;
    border-top: 1px solid var(--pal-border);
    display: grid; grid-template-columns: 88px 1fr auto; gap: 16px; align-items: start;
    cursor: pointer; transition: background 120ms;
  }
  .pal-events li:first-child { border-top: none; }
  .pal-events li:hover { background: var(--pal-hover); }
  .pal-date .pal-day { display: block; font-size: 26px; line-height: 1; color: var(--pal-ink); font-weight: 700; font-family: inherit; }
  .pal-date .pal-mon { display: block; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--pal-muted); margin-top: 4px; font-weight: 600; }
  .pal-date .pal-yr  { display: block; font-size: 11px; color: var(--pal-muted); margin-top: 2px; }
  .pal-title { font-size: 17px; font-weight: 700; color: var(--pal-ink); line-height: 1.3; }
  .pal-meta { font-size: 12px; color: var(--pal-muted); margin-top: 4px; }
  .pal-desc { font-size: 13.5px; color: var(--pal-ink-soft); margin-top: 8px; line-height: 1.55; }
  .pal-pill {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 3px 9px; border-radius: 999px; color: #fff; font-weight: 700; margin-right: 8px; vertical-align: middle;
  }
  .pal-chev { color: var(--pal-border-strong); font-size: 22px; align-self: center; }
  .pal-link { color: var(--pal-accent); font-weight: 600; border-bottom: 1px solid currentColor; text-decoration: none; }
  @media (max-width: 600px) {
    .pal-map { height: 380px; }
    .pal-head { padding: 16px 18px 14px; }
    .pal-head h3 { font-size: 19px; }
    .pal-head .pal-count { top: 18px; right: 18px; font-size: 11px; }
    .pal-events li { padding: 12px 18px; grid-template-columns: 64px 1fr; gap: 12px; }
    .pal-chev { display: none; }
    .pal-date .pal-day { font-size: 22px; }
  }
</style>

<div class="pal-root">
  <div id="pal-map" class="pal-map" aria-label="Map of Porirua community events"></div>
  <div class="pal-status" id="pal-status">Loading events…</div>
  <nav class="pal-nav" id="pal-nav" aria-label="Jump to theme"></nav>
  <section class="pal-themes" id="pal-themes"></section>
</div>

<script>
  (function () {
    var GOOGLE_SHEET_CSV_URL = "";

    var THEMES = [
      { id: "Rangatahi",                title: "Rangatahi",                subtitle: "Youth",                                   color: "#CF2028", description: "Intentionally include, enable and empower our rangatahi to set their own kaupapa and participate meaningfully and equitably in design, decision-making and implementation." },
      { id: "Weaving Porirua Together", title: "Weaving Porirua Together", subtitle: "Resilient People Network",                color: "#D97706", description: "Build and sustain momentum for courageous, bold and collaborative action by establishing a sustainable network that connects, strengthens, and leverages existing community-led rōpū." },
      { id: "Te Taiao",                 title: "Te Taiao",                 subtitle: "Our Environment",                         color: "#2E7D4F", description: "Protect and restore the mauri of our whenua, taonga and our wai — including waterways, flora and fauna, local food systems, native forests, harbour and shorelines." },
      { id: "How We Roll",              title: "How We Roll",              subtitle: "Approach & Implementation",               color: "#60174C", description: "Develop an evidence-based, community-informed, Iwi-led action plan, ensuring present and intergenerational commitment from everyone with skin in the game in Porirua." },
      { id: "Know More Do More",        title: "Know More Do More",        subtitle: "Action Through Education and Awareness",  color: "#0E7490", description: "Guarantee equitable access to environmental education and lifelong learning that enables people to connect with te taiao and act." },
      { id: "How Stuff Works",          title: "How Stuff Works",          subtitle: "Resilient Infrastructure",                color: "#7E3FA0", description: "Invest in water, waste, energy, health and transport systems that reflect the needs of our people and place — driven by indigenous and local innovation and solutions." }
    ];
    var DEFAULT_COLOR = "#60174C";

    function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
    function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
    function parseDate(s){if(!s) return null;var d=new Date(s);return isNaN(d.getTime())?null:d;}
    function dateParts(s){var d=parseDate(s);if(!d) return {day:"",mon:"",yr:""};return {day:String(d.getDate()),mon:d.toLocaleString("en-NZ",{month:"short"}),yr:String(d.getFullYear())};}
    function cmp(a,b){var da=parseDate(a.date),db=parseDate(b.date);if(da&&db) return da-db;if(da) return -1;if(db) return 1;return a.name.localeCompare(b.name);}
    function row(r){var name=r.name||r.Name;var theme=r.theme||r.Theme;if(!name||!theme) return null;var lat=parseFloat(r.lat||r.latitude),lng=parseFloat(r.lng||r.longitude);return {name:name,theme:theme,subtheme:r.subtheme||"",date:r.date||"",time:r.time||"",venue:r.venue||"",address:r.address||"",lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,url:r.url||r.website||"",description:r.description||""};}
    function ready(fn){if(window.L&&window.Papa) return fn();setTimeout(function(){ready(fn);},50);}

    function icon(L,color){return L.divIcon({className:"pal-marker",html:'<div style="width:28px;height:28px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);"></div>',iconSize:[28,28],iconAnchor:[14,14]});}
    function popup(ev,t){
      var color=t?t.color:"#60174C";
      var h='<div style="max-width:280px;color:#3c1b30;">';
      h+='<span style="display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:'+color+';padding:3px 9px;border-radius:999px;font-weight:700;margin-bottom:8px;">'+esc(t?t.title:ev.theme)+'</span>';
      if(ev.subtheme) h+=' <span style="font-size:10px;color:#8a677a;text-transform:uppercase;letter-spacing:.08em;font-weight:600;">'+esc(ev.subtheme)+'</span>';
      h+='<strong style="font-size:16px;line-height:1.25;display:block;margin:4px 0;color:#60174C;">'+esc(ev.name)+'</strong>';
      var dl=[ev.date,ev.time].filter(Boolean).join(" · ");
      if(dl) h+='<div style="font-size:12px;color:#60174C;font-weight:600;">'+esc(dl)+'</div>';
      var where=[ev.venue,ev.address].filter(Boolean).join(", ");
      if(where) h+='<div style="font-size:12px;color:#8a677a;margin-top:2px;">'+esc(where)+'</div>';
      if(ev.description) h+='<p style="font-size:13px;line-height:1.5;color:#3c1b30;margin:10px 0 8px;">'+esc(ev.description)+'</p>';
      if(ev.url) h+='<a href="'+esc(ev.url)+'" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#cf2028;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;">Learn more &rarr;</a>';
      return h+"</div>";
    }

    function render(events){
      var themeById={};THEMES.forEach(function(t){themeById[t.id]=t;});
      events.forEach(function(e,i){e.__idx=i;});
      var grouped={};THEMES.forEach(function(t){grouped[t.id]=[];});
      events.forEach(function(e){if(grouped[e.theme]) grouped[e.theme].push(e);});
      Object.keys(grouped).forEach(function(k){grouped[k].sort(cmp);});

      var L=window.L;
      var map=L.map("pal-map",{scrollWheelZoom:false}).setView([-41.1350,174.8400],12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors",maxZoom:19}).addTo(map);
      var markers={};var bounds=[];
      events.forEach(function(ev,i){
        if(ev.lat==null||ev.lng==null) return;
        var t=themeById[ev.theme];var color=t?t.color:DEFAULT_COLOR;
        markers[i]=L.marker([ev.lat,ev.lng],{icon:icon(L,color)}).bindPopup(popup(ev,t),{maxWidth:300}).addTo(map);
        bounds.push([ev.lat,ev.lng]);
      });
      if(bounds.length>1) map.fitBounds(bounds,{padding:[24,24],maxZoom:14});
      else if(bounds.length===1) map.setView(bounds[0],14);

      var nav=document.getElementById("pal-nav");nav.innerHTML="";
      THEMES.forEach(function(t){
        var n=grouped[t.id].length;
        var b=document.createElement("button");b.type="button";
        b.innerHTML='<span class="pal-swatch" style="background:'+t.color+'"></span>'+esc(t.title)+' <span style="color:var(--pal-muted);">('+n+')</span>';
        b.onclick=function(){var el=document.getElementById("pal-theme-"+slug(t.id));if(el) el.scrollIntoView({behavior:"smooth",block:"start"});};
        nav.appendChild(b);
      });

      var root=document.getElementById("pal-themes");root.innerHTML="";
      THEMES.forEach(function(t){
        var evs=grouped[t.id];
        var card=document.createElement("article");card.className="pal-card";card.id="pal-theme-"+slug(t.id);
        var h='<div class="pal-head" style="border-left-color:'+t.color+'">'
             +'<span class="pal-count">'+evs.length+' event'+(evs.length===1?"":"s")+'</span>'
             +'<h3>'+esc(t.title)+'</h3>'
             +'<div class="pal-sub">'+esc(t.subtitle||"")+'</div>'
             +(t.description?'<p>'+esc(t.description)+'</p>':"")
             +'</div>';
        var list;
        if(!evs.length){list='<ul class="pal-events pal-empty"><li>No events yet under this recommendation.</li></ul>';}
        else{
          list='<ul class="pal-events">';
          evs.forEach(function(ev){
            var d=dateParts(ev.date);
            var meta=[ev.time,ev.venue,ev.address].filter(Boolean).map(esc).join(" · ");
            list+='<li data-event-index="'+ev.__idx+'">';
            list+='<div class="pal-date"><span class="pal-day">'+esc(d.day)+'</span><span class="pal-mon">'+esc(d.mon)+'</span><span class="pal-yr">'+esc(d.yr)+'</span></div>';
            list+='<div>';
            if(ev.subtheme) list+='<span class="pal-pill" style="background:'+t.color+'">'+esc(ev.subtheme)+'</span>';
            list+='<span class="pal-title">'+esc(ev.name)+'</span>';
            if(meta) list+='<div class="pal-meta">'+meta+'</div>';
            if(ev.description) list+='<div class="pal-desc">'+esc(ev.description)+'</div>';
            if(ev.url) list+='<div class="pal-meta" style="margin-top:4px;"><a class="pal-link" href="'+esc(ev.url)+'" target="_blank" rel="noopener">Learn more &rarr;</a></div>';
            list+='</div><div class="pal-chev">&rsaquo;</div></li>';
          });
          list+='</ul>';
        }
        card.innerHTML=h+list;
        root.appendChild(card);
      });
      root.addEventListener("click",function(e){
        var li=e.target.closest("li[data-event-index]");if(!li) return;
        var idx=parseInt(li.getAttribute("data-event-index"),10);
        var m=markers[idx];if(!m) return;
        map.setView(m.getLatLng(),15,{animate:true});
        setTimeout(function(){m.openPopup();},250);
        document.getElementById("pal-map").scrollIntoView({behavior:"smooth",block:"start"});
      });

      document.getElementById("pal-status").textContent=
        events.length?("Showing "+events.length+" event"+(events.length===1?"":"s")+"."):"No events to display.";
    }

    ready(function(){
      if(!GOOGLE_SHEET_CSV_URL){
        document.getElementById("pal-status").textContent="Add a Google Sheet URL in the snippet to load events.";
        return render([]);
      }
      Papa.parse(GOOGLE_SHEET_CSV_URL,{download:true,header:true,skipEmptyLines:true,
        complete:function(r){render((r.data||[]).map(row).filter(Boolean));},
        error:function(err){console.error("[porirua-map]",err);document.getElementById("pal-status").textContent="Failed to load events.";render([]);}
      });
    });
  })();
</script>
