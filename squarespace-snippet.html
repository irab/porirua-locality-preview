<!--
  Drop-in Squarespace Code Block for the Porirua Locality organisation
  inventory, grouped by Porirua Assembly recommendation, with filters for
  recommendation and organisation type.

  Inherits the site's own palette + fonts via the :root CSS variables
  (--black-hsl, --darkAccent-hsl, --lightAccent-hsl, --accent-hsl) so it
  looks native on the Porirua Locality Squarespace site without further styling.

  How to use:
  1. In Squarespace, edit the target page and add a "Code" block (Business plan+).
  2. Paste this whole snippet in.
  3. Set DATA_URL below. It can be EITHER:
       - a published Google Sheet CSV URL (File → Share → Publish to web → CSV), OR
       - a raw CSV URL, e.g. the raw GitHub URL to data/organisations.csv.
     Leave it blank to render nothing (useful while you prepare the sheet).

  Expected CSV columns (first row = headers):
    name, orgType, theme, themes, venue, address, lat, lng, url, description, initiatives, labels

  `theme`       = primary recommendation (must match a theme id, e.g. "Rangatahi").
  `themes`      = optional comma-separated additional recommendations.
  `orgType`     = must match an organisation-type id (e.g. "Iwi & Marae").
  `initiatives` = optional; separate items with `|` or `;`.
  `labels`      = optional free-form descriptor tags; separate with `|` or `;`.
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  .pal-root {
    --pal-ink: hsla(var(--black-hsl, 316,63%,23%), 1);
    --pal-ink-soft: hsla(var(--black-hsl, 316,63%,23%), 0.82);
    --pal-muted: hsla(var(--black-hsl, 316,63%,23%), 0.6);
    --pal-border: hsla(var(--lightAccent-hsl, 7,75%,84%), 0.6);
    --pal-border-strong: hsla(var(--lightAccent-hsl, 7,75%,84%), 1);
    --pal-surface: #fff;
    --pal-hover: hsla(var(--accent-hsl, 5,75%,97%), 1);
    --pal-accent: hsla(var(--darkAccent-hsl, 358,73%,47%), 1);
    color: var(--pal-ink);
  }
  .pal-root h2, .pal-root h3, .pal-root .pal-title {
    font-family: inherit;
    color: var(--pal-ink);
  }
  .pal-map {
    height: 480px; width: 100%;
    border: 1px solid var(--pal-border);
    border-radius: 16px;
    background: #eceae5;
    box-shadow: 0 4px 18px -8px hsla(var(--black-hsl, 316,63%,23%), 0.15);
  }
  .pal-status { font-size: 12px; color: var(--pal-muted); margin-top: 10px; }

  /* Marker hover tooltip */
  .leaflet-tooltip.pal-tooltip {
    background: var(--pal-surface);
    border: 1px solid var(--pal-border-strong);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 4px 14px -6px hsla(var(--black-hsl, 316,63%,23%), 0.25);
    color: var(--pal-ink);
    font-family: inherit;
    max-width: 240px;
    white-space: normal;
  }
  .leaflet-tooltip.pal-tooltip::before { border-top-color: var(--pal-border-strong); }
  .pal-tooltip .pal-tooltip-name {
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    color: var(--pal-ink); line-height: 1.25;
  }
  .pal-tooltip .pal-tooltip-hint {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--pal-accent); font-weight: 600; margin-top: 3px;
  }

  /* Filter bars */
  .pal-filters { margin: 22px 0 4px; display: flex; flex-direction: column; gap: 10px; }
  .pal-filter-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pal-filter-label {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: var(--pal-ink); flex-shrink: 0; min-width: 180px;
  }
  .pal-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .pal-filter-chip {
    background: var(--pal-surface);
    border: 1.5px solid var(--pal-border-strong);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--pal-ink);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 120ms, border-color 120ms, color 120ms, transform 120ms;
    white-space: nowrap;
  }
  .pal-filter-chip:hover:not(.pal-active) { border-color: var(--pal-ink); background: var(--pal-hover); }
  /* Tinted (org-type) chips: white fill (keeps the button affordance),
     border picks up the marker colour so the row doubles as a legend.
     Inline --pal-chip-border / --pal-chip-border-hover are set per-button
     by chip(). */
  .pal-filter-chip.pal-tinted:not(.pal-active) {
    border-color: var(--pal-chip-border, var(--pal-border-strong));
  }
  .pal-filter-chip.pal-tinted:hover:not(.pal-active) {
    background: var(--pal-hover);
    border-color: var(--pal-chip-border-hover, var(--pal-ink));
  }
  .pal-filter-chip.pal-active { color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px -3px hsla(var(--black-hsl,316,63%,23%), 0.4); }
  .pal-filter-chip.pal-active:hover { filter: brightness(1.05); }
  .pal-filter-chip-icon { display: inline-flex; align-items: center; }
  .pal-filter-clear {
    align-self: flex-start; margin-top: 2px;
    background: transparent; border: none;
    color: var(--pal-accent);
    font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 2px 0;
    border-bottom: 1px solid currentColor;
  }
  .pal-filter-clear:hover { color: var(--pal-ink); }

  .pal-themes { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
  .pal-card {
    background: var(--pal-surface);
    border: 1px solid var(--pal-border);
    border-radius: 18px;
    overflow: hidden;
    scroll-margin-top: 20px;
    box-shadow: 0 2px 12px -6px hsla(var(--black-hsl, 316,63%,23%), 0.08);
  }
  .pal-head {
    padding: 20px 22px 18px; border-left: 6px solid var(--pal-ink); position: relative;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .pal-head .pal-badge {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px -4px rgba(0,0,0,0.3);
  }
  .pal-head .pal-head-text { flex: 1; min-width: 0; padding-right: 88px; }
  .pal-head h3 { margin: 0; font-size: 22px; line-height: 1.2; color: var(--pal-ink); }
  .pal-head .pal-sub { margin: 4px 0 0; color: var(--pal-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .pal-head p { margin: 12px 0 0; color: var(--pal-ink-soft); font-size: 14px; line-height: 1.55; }
  .pal-head .pal-count { position: absolute; top: 22px; right: 22px; font-size: 12px; color: var(--pal-muted); font-weight: 500; }

  /* Organisation list inside each theme card */
  .pal-orgs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pal-border); }
  .pal-orgs.pal-empty li { padding: 18px 22px; font-size: 13px; color: var(--pal-muted); font-style: italic; }
  .pal-orgs li {
    padding: 16px 22px;
    border-top: 1px solid var(--pal-border);
    display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: start;
    cursor: pointer; transition: background 120ms;
  }
  .pal-orgs li:first-child { border-top: none; }
  .pal-orgs li:hover { background: var(--pal-hover); }
  .pal-orgs .pal-org-badge {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px -3px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  .pal-orgs .pal-org-body { min-width: 0; }
  .pal-orgs .pal-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .pal-orgs .pal-title { font-size: 18px; font-weight: 700; color: var(--pal-ink); line-height: 1.25; display: block; }
  .pal-orgs .pal-meta { font-size: 12px; color: var(--pal-muted); margin-top: 4px; }
  .pal-orgs .pal-desc { font-size: 13.5px; color: var(--pal-ink-soft); margin-top: 8px; line-height: 1.55; }
  .pal-orgs .pal-initiatives-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-top: 10px; margin-bottom: 4px; }
  .pal-orgs .pal-initiatives { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--pal-ink-soft); }
  .pal-orgs .pal-initiatives li { padding: 0; border: none; display: list-item; cursor: default; background: transparent !important; margin: 0; grid-template-columns: none; }
  .pal-orgs .pal-initiatives li:hover { background: transparent; }
  .pal-orgs .pal-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .pal-orgs .pal-label-chip {
    font-size: 10.5px; color: var(--pal-ink);
    background: var(--pal-border-strong);
    padding: 2px 9px; border-radius: 999px; font-weight: 600; letter-spacing: 0.02em;
    cursor: default;
  }
  .pal-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 3px 9px; border-radius: 999px; color: #fff; font-weight: 700;
    vertical-align: middle;
  }
  .pal-pill.pal-theme { font-size: 9.5px; padding: 2px 7px; }
  .pal-pill-icon { display: inline-flex; align-items: center; }
  .pal-chev { color: var(--pal-border-strong); font-size: 22px; align-self: center; }
  .pal-link { color: var(--pal-accent); font-weight: 600; border-bottom: 1px solid currentColor; text-decoration: none; }
  @media (max-width: 720px) {
    .pal-filter-label { min-width: 0; width: 100%; }
    .pal-filter-bar { gap: 6px; }
  }
  @media (max-width: 600px) {
    .pal-map { height: 380px; }
    .pal-filter-chip { font-size: 11.5px; padding: 5px 10px; }
    .pal-head { padding: 16px 18px 14px; gap: 12px; }
    .pal-head .pal-badge { width: 40px; height: 40px; }
    .pal-head .pal-head-text { padding-right: 56px; }
    .pal-head h3 { font-size: 19px; }
    .pal-head .pal-count { top: 18px; right: 18px; font-size: 11px; }
    .pal-orgs li { padding: 14px 18px; grid-template-columns: 44px 1fr; gap: 12px; }
    .pal-orgs .pal-org-badge { width: 36px; height: 36px; }
    .pal-orgs .pal-title { font-size: 16px; }
    .pal-chev { display: none; }
  }
</style>

<div class="pal-root">
  <div id="pal-map" class="pal-map" aria-label="Map of Porirua organisations"></div>
  <div class="pal-status" id="pal-status">Loading organisations…</div>
  <div class="pal-filters" id="pal-filters" aria-label="Filter organisations"></div>
  <section class="pal-themes" id="pal-themes"></section>
</div>

<script>
  (function () {
    // Data source. Accepts EITHER:
    //   - a Google Sheet CSV URL (export?format=csv&gid=<tab> or pub?output=csv), OR
    //   - a raw CSV URL (e.g. https://raw.githubusercontent.com/<user>/<repo>/main/data/organisations.csv).
    // The sheet below is the live Porirua Locality inventory (edit-in-place).
    var DATA_URL = "https://docs.google.com/spreadsheets/d/1xKFgoYtjND3mfgojyddnq2zyKkxH7NXNGejDzFKQP7I/export?format=csv&gid=0";

    // ---------- Icons (Lucide-style) ----------
    var ICONS = {
      // Theme icons
      sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
      network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
      trees: '<path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M7 16v6"/><path d="M13 19h6"/><path d="M16 22V5"/><path d="M16 5a3 3 0 0 1 3 3c.4.7.7 1.5.7 2.3A3.5 3.5 0 0 1 19 14a4 4 0 0 1-4.3-3.1"/>',
      compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
      "book-open": '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
      cog: '<path d="M12 20a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>',
      // Organisation-type icons
      landmark: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      "users-round": '<path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/>',
      "graduation-cap": '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
      "building-2": '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
      store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
      megaphone: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'
    };

    function svgIcon(key, color, size, sw){
      var inner = ICONS[key]; if(!inner) return "";
      return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
    }

    // ---------- Themes + org types ----------
    var THEMES = [
      { id: "Rangatahi",                title: "Rangatahi",                subtitle: "Youth",                                   color: "#CF2028", icon: "sprout",    description: "Intentionally include, enable and empower our rangatahi to set their own kaupapa and participate meaningfully and equitably in design, decision-making and implementation." },
      { id: "Weaving Porirua Together", title: "Weaving Porirua Together", subtitle: "Resilient People Network",                color: "#D97706", icon: "network",   description: "Build and sustain momentum for courageous, bold and collaborative action by establishing a sustainable network that connects, strengthens, and leverages existing community-led rōpū." },
      { id: "Te Taiao",                 title: "Te Taiao",                 subtitle: "Our Environment",                         color: "#2E7D4F", icon: "trees",     description: "Protect and restore the mauri of our whenua, taonga and our wai — including waterways, flora and fauna, local food systems, native forests, harbour and shorelines." },
      { id: "How We Roll",              title: "How We Roll",              subtitle: "Approach & Implementation",               color: "#60174C", icon: "compass",   description: "Develop an evidence-based, community-informed, Iwi-led action plan, ensuring present and intergenerational commitment from everyone with skin in the game in Porirua." },
      { id: "Know More Do More",        title: "Know More Do More",        subtitle: "Action Through Education and Awareness",  color: "#0E7490", icon: "book-open", description: "Guarantee equitable access to environmental education and lifelong learning that enables people to connect with te taiao and act." },
      { id: "How Stuff Works",          title: "How Stuff Works",          subtitle: "Resilient Infrastructure",                color: "#7E3FA0", icon: "cog",       description: "Invest in water, waste, energy, health and transport systems that reflect the needs of our people and place — driven by indigenous and local innovation and solutions." }
    ];
    var ORG_TYPES = [
      { id: "Iwi & Marae",          title: "Iwi & Marae",          icon: "landmark",        color: "#6b2a3d" },
      { id: "Community Group",      title: "Community Group",      icon: "users",           color: "#a04a1f" },
      { id: "Kaupapa Group",        title: "Kaupapa Group",        icon: "users-round",     color: "#7a4a1f" },
      { id: "School / Kura",        title: "School / Kura",        icon: "graduation-cap",  color: "#335577" },
      { id: "Council / Government", title: "Council / Government", icon: "building-2",      color: "#4a4a5a" },
      { id: "Social Enterprise",    title: "Social Enterprise",    icon: "store",           color: "#5a6a3a" },
      { id: "Advocacy / Research",  title: "Advocacy / Research",  icon: "megaphone",       color: "#583e74" }
    ];
    var DEFAULT_COLOR = "#60174C";

    // ---------- Helpers ----------
    function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
    function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
    // hex -> rgba; used to tint the org-type filter chips so the row
    // doubles as a legend of the marker colours.
    function tint(hex, a){ var h=String(hex||"").replace("#",""); if(h.length!==6) return "rgba(96,23,76,"+a+")"; return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16)+","+a+")"; }
    // `|`, `;` or newline -- same convention as initiatives/labels
    function splitList(s){ if(s==null) return []; if(Array.isArray(s)) return s.filter(Boolean); return String(s).split(/\s*[\n;|]+\s*/).map(function(t){return t.trim();}).filter(Boolean); }
    // Comma only (themes never contain commas internally)
    function splitThemes(s){ if(s==null) return []; if(Array.isArray(s)) return s.filter(Boolean); return String(s).split(/\s*,\s*/).map(function(t){return t.trim();}).filter(Boolean); }
    function row(r){
      var name=r.name||r.Name;
      var primary=r.theme||r.Theme;
      if(!name||!primary) return null;
      var extra=splitThemes(r.themes||r.Themes);
      var themes=extra.slice();
      if(themes.indexOf(primary)<0) themes.unshift(primary);
      var lat=parseFloat(r.lat||r.latitude),lng=parseFloat(r.lng||r.longitude);
      return {
        name:name, theme:primary, themes:themes,
        orgType:r.orgType||r.organisationType||r.orgtype||"",
        venue:r.venue||"", address:r.address||"",
        lat:isNaN(lat)?null:lat, lng:isNaN(lng)?null:lng,
        url:r.url||r.website||"", description:r.description||"",
        initiatives:splitList(r.initiatives||r.Initiatives),
        labels:splitList(r.labels||r.Labels)
      };
    }
    function ready(fn){if(window.L&&window.Papa) return fn();setTimeout(function(){ready(fn);},50);}

    // ---------- Map + popup ----------
    // One colour + one icon per organisation TYPE — consistent marker
    // styling so the same kind of org always looks the same on the map.
    function icon(L, orgType){
      var color = orgType && orgType.color ? orgType.color : DEFAULT_COLOR;
      var ic = orgType && orgType.icon ? svgIcon(orgType.icon, "#fff", 18, 2.2) : "";
      var html = '<div style="width:36px;height:36px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;">'+ic+'</div>';
      return L.divIcon({className:"pal-marker",html:html,iconSize:[36,36],iconAnchor:[18,18]});
    }
    function popup(org, themeById, orgType){
      var color = orgType && orgType.color ? orgType.color : DEFAULT_COLOR;
      var h='<div style="max-width:300px;color:#3c1b30;">';
      if(orgType){
        h+='<div style="margin:0 0 8px;">'
          +'<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:'+orgType.color+';padding:3px 9px;border-radius:999px;font-weight:700;">'
          +svgIcon(orgType.icon,"#fff",11,2)+esc(orgType.title)+'</span>'
          +'</div>';
      }
      h+='<div style="font-size:17px;line-height:1.25;margin:0 0 8px;color:#60174C;font-weight:700;">'+esc(org.name)+'</div>';
      if(org.themes && org.themes.length){
        h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px;">';
        org.themes.forEach(function(tid){
          var th=themeById[tid]; if(!th) return;
          h+='<span style="display:inline-flex;align-items:center;gap:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:'+th.color+';padding:2px 7px;border-radius:999px;font-weight:700;">'+svgIcon(th.icon,"#fff",10,2.2)+esc(th.title)+'</span>';
        });
        h+='</div>';
      }
      var where=[org.venue,org.address].filter(Boolean).join(", ");
      if(where) h+='<div style="font-size:12px;color:#8a677a;margin-top:2px;">'+esc(where)+'</div>';
      if(org.description) h+='<p style="font-size:13px;line-height:1.5;color:#3c1b30;margin:10px 0 6px;">'+esc(org.description)+'</p>';
      if(org.initiatives && org.initiatives.length){
        h+='<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:'+color+';font-weight:700;margin-top:8px;margin-bottom:3px;">Key initiatives</div>';
        h+='<ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.45;color:#3c1b30;">';
        org.initiatives.forEach(function(it){ h+='<li>'+esc(it)+'</li>'; });
        h+='</ul>';
      }
      if(org.labels && org.labels.length){
        h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;">';
        org.labels.forEach(function(label){
          h+='<span style="font-size:10px;color:#60174C;background:#f3d7d3;padding:2px 8px;border-radius:999px;font-weight:600;letter-spacing:.02em;">'+esc(label)+'</span>';
        });
        h+='</div>';
      }
      if(org.url) h+='<a href="'+esc(org.url)+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:10px;font-size:12px;color:#cf2028;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;">Visit website &rarr;</a>';
      return h+"</div>";
    }

    // ---------- Bootstrap ----------
    function boot(allOrgs){
      var themeById={};THEMES.forEach(function(t){themeById[t.id]=t;});
      var orgById={};ORG_TYPES.forEach(function(o){orgById[o.id]=o;});
      allOrgs.forEach(function(o,i){o.__idx=i;});

      var L=window.L;
      var map=L.map("pal-map",{scrollWheelZoom:false}).setView([-41.1350,174.8400],12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors",maxZoom:19}).addTo(map);
      var layer=L.layerGroup().addTo(map);
      var markers={};
      var state={themes:new Set(),orgs:new Set()};

      function matches(org){
        if(state.themes.size){
          var hit=false;
          (org.themes||[]).forEach(function(t){ if(state.themes.has(t)) hit=true; });
          if(!hit) return false;
        }
        if(state.orgs.size && !state.orgs.has(org.orgType)) return false;
        return true;
      }

      function populateMap(orgs){
        layer.clearLayers(); markers={};
        var bounds=[];
        orgs.forEach(function(org){
          if(org.lat==null||org.lng==null) return;
          var org2=orgById[org.orgType];
          var tip='<div class="pal-tooltip-name">'+esc(org.name)+'</div><div class="pal-tooltip-hint">Click to see more</div>';
          var m=L.marker([org.lat,org.lng],{icon:icon(L,org2)})
            .bindPopup(popup(org,themeById,org2),{maxWidth:320})
            .bindTooltip(tip,{direction:"top",offset:[0,-18],opacity:1,className:"pal-tooltip"});
          layer.addLayer(m); markers[org.__idx]=m; bounds.push([org.lat,org.lng]);
        });
        if(bounds.length>1) map.fitBounds(bounds,{padding:[24,24],maxZoom:14});
        else if(bounds.length===1) map.setView(bounds[0],14);
        else map.setView([-41.1350,174.8400],12);
      }

      function chip(item, stateSet, opts){
        var tinted = !!(opts && opts.tinted);
        var b=document.createElement("button"); b.type="button";
        b.className="pal-filter-chip" + (tinted ? " pal-tinted" : "");
        var active=stateSet.has(item.id);
        if(tinted){
          b.style.setProperty("--pal-chip-border", tint(item.color, 0.55));
          b.style.setProperty("--pal-chip-border-hover", tint(item.color, 0.9));
        }
        if(active){ b.classList.add("pal-active"); b.style.background=item.color; b.style.borderColor=item.color; }
        var iconColor = active ? "#fff" : item.color;
        b.innerHTML='<span class="pal-filter-chip-icon">'+svgIcon(item.icon, iconColor, 14, 2)+'</span><span>'+esc(item.title)+'</span>';
        b.onclick=function(){ if(stateSet.has(item.id)) stateSet.delete(item.id); else stateSet.add(item.id); refresh(); };
        return b;
      }

      function renderFilters(){
        var root=document.getElementById("pal-filters"); root.innerHTML="";
        function bar(label, items, stateSet, opts){
          var wrap=document.createElement("div"); wrap.className="pal-filter-bar";
          var lb=document.createElement("span"); lb.className="pal-filter-label"; lb.textContent=label; wrap.appendChild(lb);
          var chips=document.createElement("div"); chips.className="pal-filter-chips";
          items.forEach(function(it){ chips.appendChild(chip(it, stateSet, opts)); });
          wrap.appendChild(chips); return wrap;
        }
        root.appendChild(bar("Filter by recommendation", THEMES, state.themes));
        root.appendChild(bar("Filter by organisation", ORG_TYPES, state.orgs, { tinted: true }));
        if(state.themes.size + state.orgs.size > 0){
          var clr=document.createElement("button"); clr.type="button"; clr.className="pal-filter-clear";
          clr.textContent="Clear all filters";
          clr.onclick=function(){ state.themes.clear(); state.orgs.clear(); refresh(); };
          root.appendChild(clr);
        }
      }

      function renderThemes(grouped, hiddenThemes){
        var root=document.getElementById("pal-themes"); root.innerHTML="";
        THEMES.forEach(function(t){
          if(hiddenThemes && hiddenThemes.has(t.id)) return;
          var orgs=grouped[t.id]||[];
          var card=document.createElement("article"); card.className="pal-card"; card.id="pal-theme-"+slug(t.id);
          var badge = t.icon ? '<div class="pal-badge" style="background:'+t.color+'">'+svgIcon(t.icon,"#fff",22,2)+'</div>' : '';
          var head='<div class="pal-head" style="border-left-color:'+t.color+'">'
               +'<span class="pal-count">'+orgs.length+' organisation'+(orgs.length===1?"":"s")+'</span>'
               +badge
               +'<div class="pal-head-text">'
               +'<h3>'+esc(t.title)+'</h3>'
               +'<div class="pal-sub">'+esc(t.subtitle||"")+'</div>'
               +(t.description?'<p>'+esc(t.description)+'</p>':"")
               +'</div></div>';
          var list;
          if(!orgs.length){ list='<ul class="pal-orgs pal-empty"><li>No organisations match the current filters.</li></ul>'; }
          else{
            list='<ul class="pal-orgs">';
            orgs.forEach(function(org){
              var orgType=orgById[org.orgType];
              var orgColor=orgType?orgType.color:"#8a677a";
              list+='<li data-org-index="'+org.__idx+'">';
              list+='<div class="pal-org-badge" style="background:'+orgColor+'">'+(orgType?svgIcon(orgType.icon,"#fff",22,2):"")+'</div>';
              list+='<div class="pal-org-body">';
              var pills="";
              if(orgType){
                pills+='<span class="pal-pill" style="background:'+orgType.color+'"><span class="pal-pill-icon">'+svgIcon(orgType.icon,"#fff",11,2)+'</span>'+esc(orgType.title)+'</span>';
              }
              (org.themes||[]).forEach(function(tid){
                var th=themeById[tid]; if(!th) return;
                pills+='<span class="pal-pill pal-theme" style="background:'+th.color+'"><span class="pal-pill-icon">'+svgIcon(th.icon,"#fff",10,2.2)+'</span>'+esc(th.title)+'</span>';
              });
              if(pills) list+='<div class="pal-pills">'+pills+'</div>';
              list+='<span class="pal-title">'+esc(org.name)+'</span>';
              var loc=[org.venue,org.address].filter(Boolean).join(" · ");
              if(loc) list+='<div class="pal-meta">'+esc(loc)+'</div>';
              if(org.description) list+='<div class="pal-desc">'+esc(org.description)+'</div>';
              if(org.initiatives && org.initiatives.length){
                list+='<div class="pal-initiatives-label" style="color:'+orgColor+'">Key initiatives</div>';
                list+='<ul class="pal-initiatives">';
                org.initiatives.forEach(function(it){ list+='<li>'+esc(it)+'</li>'; });
                list+='</ul>';
              }
              if(org.labels && org.labels.length){
                list+='<div class="pal-labels">';
                org.labels.forEach(function(label){ list+='<span class="pal-label-chip">'+esc(label)+'</span>'; });
                list+='</div>';
              }
              if(org.url) list+='<div class="pal-meta" style="margin-top:6px;"><a class="pal-link" href="'+esc(org.url)+'" target="_blank" rel="noopener">Visit website &rarr;</a></div>';
              list+='</div><div class="pal-chev">&rsaquo;</div></li>';
            });
            list+='</ul>';
          }
          card.innerHTML=head+list;
          root.appendChild(card);
        });
        root.onclick=function(e){
          var li=e.target.closest("li[data-org-index]"); if(!li) return;
          var idx=parseInt(li.getAttribute("data-org-index"),10);
          var m=markers[idx]; if(!m) return;
          map.setView(m.getLatLng(),15,{animate:true});
          setTimeout(function(){m.openPopup();},250);
          document.getElementById("pal-map").scrollIntoView({behavior:"smooth",block:"start"});
        };
      }

      function groupOrgs(orgs){
        var grouped={};THEMES.forEach(function(t){grouped[t.id]=[];});
        if(state.themes.size){
          orgs.forEach(function(org){
            (org.themes||[]).forEach(function(tid){
              if(state.themes.has(tid) && grouped[tid]) grouped[tid].push(org);
            });
          });
        } else {
          orgs.forEach(function(org){ if(grouped[org.theme]) grouped[org.theme].push(org); });
        }
        Object.keys(grouped).forEach(function(k){ grouped[k].sort(function(a,b){return a.name.localeCompare(b.name);}); });
        return grouped;
      }

      function setStatus(visible,total){
        var el=document.getElementById("pal-status");
        if(!total){ el.textContent="No organisations to display."; return; }
        var parts=[];
        if(visible===total) parts.push("Showing all "+total+" organisation"+(total===1?"":"s"));
        else parts.push("Showing "+visible+" of "+total+" organisations");
        var filters=[];
        if(state.themes.size) filters.push(state.themes.size+" recommendation"+(state.themes.size===1?"":"s"));
        if(state.orgs.size) filters.push(state.orgs.size+" organisation type"+(state.orgs.size===1?"":"s"));
        if(filters.length) parts.push("filtered by "+filters.join(" and "));
        el.textContent=parts.join(" — ")+".";
      }

      function refresh(){
        var visible=allOrgs.filter(matches);
        var grouped=groupOrgs(visible);
        var hidden=null;
        if(state.themes.size){ hidden=new Set(); THEMES.forEach(function(t){ if(!state.themes.has(t.id)) hidden.add(t.id); }); }
        populateMap(visible);
        renderFilters();
        renderThemes(grouped, hidden);
        setStatus(visible.length, allOrgs.length);
      }

      refresh();
    }

    ready(function(){
      if(!DATA_URL){
        document.getElementById("pal-status").textContent="Set DATA_URL at the top of the snippet to load organisations.";
        return boot([]);
      }
      Papa.parse(DATA_URL,{download:true,header:true,skipEmptyLines:true,
        complete:function(r){
          var orgs=(r.data||[]).map(row).filter(Boolean);
          if(!orgs.length){ document.getElementById("pal-status").textContent="Data source returned no rows. Check column headers and publish status."; }
          boot(orgs);
        },
        error:function(err){console.error("[porirua-map]",err);document.getElementById("pal-status").textContent="Failed to load organisations from DATA_URL.";boot([]);}
      });
    });
  })();
</script>
