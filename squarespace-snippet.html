<!--
  Drop-in Squarespace Code Block for the Porirua Locality events view,
  grouped by Porirua Assembly Recommendation themes, with filters for
  recommendation and organisation type.

  This snippet is designed to inherit the site's own palette + fonts
  (via the site's `:root` CSS variables like --black-hsl and --accent-hsl,
  plus the site's body/heading font-families). It therefore looks native
  on the Porirua Locality Squarespace site without any further styling.

  How to use:
  1. In Squarespace, edit the target page and add a "Code" block (Business plan+).
  2. Paste this whole snippet in.
  3. Replace GOOGLE_SHEET_CSV_URL with your Sheet's "Publish to web -> CSV" URL.

  Expected sheet columns (first row = headers):
    name, theme, subtheme, orgType, orgName, date, time, venue, address, lat, lng, url, description

  `theme`   must match one of the theme ids (e.g. "Rangatahi").
  `orgType` must match one of the organisation type ids (e.g. "Iwi & Marae").
-->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  /* The Porirua Locality site already defines --black-hsl (plum),
     --darkAccent-hsl (crimson), --lightAccent-hsl (dusty blush) and
     --accent-hsl (cream) on :root. We reuse those so this snippet
     re-skins automatically if the site's palette is ever changed. */
  .pal-root {
    --pal-ink: hsla(var(--black-hsl, 316,63%,23%), 1);
    --pal-ink-soft: hsla(var(--black-hsl, 316,63%,23%), 0.82);
    --pal-muted: hsla(var(--black-hsl, 316,63%,23%), 0.6);
    --pal-border: hsla(var(--lightAccent-hsl, 7,75%,84%), 0.6);
    --pal-border-strong: hsla(var(--lightAccent-hsl, 7,75%,84%), 1);
    --pal-surface: #fff;
    --pal-hover: hsla(var(--accent-hsl, 5,75%,97%), 1);
    --pal-accent: hsla(var(--darkAccent-hsl, 358,73%,47%), 1);
    color: var(--pal-ink);
    /* Inherit the site's body font automatically. */
  }
  .pal-root h2, .pal-root h3, .pal-root .pal-title, .pal-root .pal-day {
    /* Inherits the site's Recoleta heading font. */
    font-family: inherit;
    color: var(--pal-ink);
  }
  .pal-map {
    height: 480px; width: 100%;
    border: 1px solid var(--pal-border);
    border-radius: 16px;
    background: #eceae5;
    box-shadow: 0 4px 18px -8px hsla(var(--black-hsl, 316,63%,23%), 0.15);
  }
  .pal-status { font-size: 12px; color: var(--pal-muted); margin-top: 10px; }

  /* Filter bars */
  .pal-filters { margin: 22px 0 4px; display: flex; flex-direction: column; gap: 10px; }
  .pal-filter-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pal-filter-label {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: var(--pal-ink); flex-shrink: 0; min-width: 180px;
  }
  .pal-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .pal-filter-chip {
    background: var(--pal-surface);
    border: 1.5px solid var(--pal-border-strong);
    border-radius: 999px;
    padding: 6px 12px;
    font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--pal-ink);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 120ms, border-color 120ms, color 120ms, transform 120ms;
    white-space: nowrap;
  }
  .pal-filter-chip:hover:not(.pal-active) { border-color: var(--pal-ink); background: var(--pal-hover); }
  .pal-filter-chip.pal-active { color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px -3px hsla(var(--black-hsl,316,63%,23%), 0.4); }
  .pal-filter-chip.pal-active:hover { filter: brightness(1.05); }
  .pal-filter-chip-icon { display: inline-flex; align-items: center; }
  .pal-filter-clear {
    align-self: flex-start; margin-top: 2px;
    background: transparent; border: none;
    color: var(--pal-accent);
    font-family: inherit; font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 2px 0;
    border-bottom: 1px solid currentColor;
  }
  .pal-filter-clear:hover { color: var(--pal-ink); }

  .pal-themes { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
  .pal-card {
    background: var(--pal-surface);
    border: 1px solid var(--pal-border);
    border-radius: 18px;
    overflow: hidden;
    scroll-margin-top: 20px;
    box-shadow: 0 2px 12px -6px hsla(var(--black-hsl, 316,63%,23%), 0.08);
  }
  .pal-head {
    padding: 20px 22px 18px; border-left: 6px solid var(--pal-ink); position: relative;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .pal-head .pal-badge {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px -4px rgba(0,0,0,0.3);
  }
  .pal-head .pal-head-text { flex: 1; min-width: 0; padding-right: 72px; }
  .pal-head h3 { margin: 0; font-size: 22px; line-height: 1.2; color: var(--pal-ink); }
  .pal-head .pal-sub { margin: 4px 0 0; color: var(--pal-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .pal-head p { margin: 12px 0 0; color: var(--pal-ink-soft); font-size: 14px; line-height: 1.55; }
  .pal-head .pal-count { position: absolute; top: 22px; right: 22px; font-size: 12px; color: var(--pal-muted); font-weight: 500; }

  .pal-events { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pal-border); }
  .pal-events.pal-empty li { padding: 18px 22px; font-size: 13px; color: var(--pal-muted); font-style: italic; }
  .pal-events li {
    padding: 14px 22px;
    border-top: 1px solid var(--pal-border);
    display: grid; grid-template-columns: 88px 1fr auto; gap: 16px; align-items: start;
    cursor: pointer; transition: background 120ms;
  }
  .pal-events li:first-child { border-top: none; }
  .pal-events li:hover { background: var(--pal-hover); }
  .pal-date .pal-day { display: block; font-size: 26px; line-height: 1; color: var(--pal-ink); font-weight: 700; font-family: inherit; }
  .pal-date .pal-mon { display: block; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--pal-muted); margin-top: 4px; font-weight: 600; }
  .pal-date .pal-yr  { display: block; font-size: 11px; color: var(--pal-muted); margin-top: 2px; }
  .pal-title { font-size: 17px; font-weight: 700; color: var(--pal-ink); line-height: 1.3; }
  .pal-meta { font-size: 12px; color: var(--pal-muted); margin-top: 4px; }
  .pal-meta.pal-org-name { color: var(--pal-ink-soft); font-weight: 600; font-size: 12.5px; }
  .pal-desc { font-size: 13.5px; color: var(--pal-ink-soft); margin-top: 8px; line-height: 1.55; }
  .pal-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 3px 9px; border-radius: 999px; color: #fff; font-weight: 700; margin-right: 8px; vertical-align: middle;
  }
  .pal-pill-icon { display: inline-flex; align-items: center; }
  .pal-chev { color: var(--pal-border-strong); font-size: 22px; align-self: center; }
  .pal-link { color: var(--pal-accent); font-weight: 600; border-bottom: 1px solid currentColor; text-decoration: none; }
  @media (max-width: 720px) {
    .pal-filter-label { min-width: 0; width: 100%; }
    .pal-filter-bar { gap: 6px; }
  }
  @media (max-width: 600px) {
    .pal-map { height: 380px; }
    .pal-filter-chip { font-size: 11.5px; padding: 5px 10px; }
    .pal-head { padding: 16px 18px 14px; gap: 12px; }
    .pal-head .pal-badge { width: 40px; height: 40px; }
    .pal-head .pal-head-text { padding-right: 56px; }
    .pal-head h3 { font-size: 19px; }
    .pal-head .pal-count { top: 18px; right: 18px; font-size: 11px; }
    .pal-events li { padding: 12px 18px; grid-template-columns: 64px 1fr; gap: 12px; }
    .pal-chev { display: none; }
    .pal-date .pal-day { font-size: 22px; }
  }
</style>

<div class="pal-root">
  <div id="pal-map" class="pal-map" aria-label="Map of Porirua community events"></div>
  <div class="pal-status" id="pal-status">Loading events…</div>
  <div class="pal-filters" id="pal-filters" aria-label="Filter events"></div>
  <section class="pal-themes" id="pal-themes"></section>
</div>

<script>
  (function () {
    var GOOGLE_SHEET_CSV_URL = "";

    // ---------- Icons (Lucide-style) ----------
    var ICONS = {
      // Theme icons
      sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
      network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
      trees: '<path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M7 16v6"/><path d="M13 19h6"/><path d="M16 22V5"/><path d="M16 5a3 3 0 0 1 3 3c.4.7.7 1.5.7 2.3A3.5 3.5 0 0 1 19 14a4 4 0 0 1-4.3-3.1"/>',

      "book-open": '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
      cog: '<path d="M12 20a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>',

      droplet: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
      recycle: '<path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/>',
      bus: '<path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
      zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
      "heart-pulse": '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
      // Organisation-type icons
      landmark: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      "users-round": '<path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/>',
      "graduation-cap": '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
      "building-2": '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
      store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
      megaphone: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'
    };
    var SUBTHEME_ICONS = { Water: "droplet", Waste: "recycle", Transport: "bus", Energy: "zap", Health: "heart-pulse" };

    function svgIcon(key, color, size, sw){
      var inner = ICONS[key]; if(!inner) return "";
      return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
    }
    function subthemeSvg(sub, color, size){ var k = SUBTHEME_ICONS[sub]; return k ? svgIcon(k, color, size||14, 2) : ""; }

    // ---------- Themes and organisation types ----------
    var THEMES = [
      { id: "Rangatahi",                title: "Rangatahi",                subtitle: "Youth",                                   color: "#CF2028", icon: "sprout",    description: "Intentionally include, enable and empower our rangatahi to set their own kaupapa and participate meaningfully and equitably in design, decision-making and implementation." },
      { id: "Weaving Porirua Together", title: "Weaving Porirua Together", subtitle: "Resilient People Network",                color: "#D97706", icon: "network",   description: "Build and sustain momentum for courageous, bold and collaborative action by establishing a sustainable network that connects, strengthens, and leverages existing community-led rōpū." },
      { id: "Te Taiao",                 title: "Te Taiao",                 subtitle: "Our Environment",                         color: "#2E7D4F", icon: "trees",     description: "Protect and restore the mauri of our whenua, taonga and our wai — including waterways, flora and fauna, local food systems, native forests, harbour and shorelines." },
      { id: "How We Roll",              title: "How We Roll",              subtitle: "Approach & Implementation",               color: "#60174C", icon: "compass",   description: "Develop an evidence-based, community-informed, Iwi-led action plan, ensuring present and intergenerational commitment from everyone with skin in the game in Porirua." },
      { id: "Know More Do More",        title: "Know More Do More",        subtitle: "Action Through Education and Awareness",  color: "#0E7490", icon: "book-open", description: "Guarantee equitable access to environmental education and lifelong learning that enables people to connect with te taiao and act." },
      { id: "How Stuff Works",          title: "How Stuff Works",          subtitle: "Resilient Infrastructure",                color: "#7E3FA0", icon: "cog",       description: "Invest in water, waste, energy, health and transport systems that reflect the needs of our people and place — driven by indigenous and local innovation and solutions." }
    ];
    var ORG_TYPES = [
      { id: "Iwi & Marae",          title: "Iwi & Marae",          icon: "landmark",        color: "#6b2a3d" },
      { id: "Community Group",      title: "Community Group",      icon: "users",           color: "#a04a1f" },
      { id: "Kaupapa Group",        title: "Kaupapa Group",        icon: "users-round",     color: "#7a4a1f" },
      { id: "School / Kura",        title: "School / Kura",        icon: "graduation-cap",  color: "#335577" },
      { id: "Council / Government", title: "Council / Government", icon: "building-2",      color: "#4a4a5a" },
      { id: "Social Enterprise",    title: "Social Enterprise",    icon: "store",           color: "#5a6a3a" },
      { id: "Advocacy / Research",  title: "Advocacy / Research",  icon: "megaphone",       color: "#583e74" }
    ];
    var DEFAULT_COLOR = "#60174C";

    // ---------- Helpers ----------
    function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
    function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
    function parseDate(s){if(!s) return null;var d=new Date(s);return isNaN(d.getTime())?null:d;}
    function dateParts(s){var d=parseDate(s);if(!d) return {day:"",mon:"",yr:""};return {day:String(d.getDate()),mon:d.toLocaleString("en-NZ",{month:"short"}),yr:String(d.getFullYear())};}
    function cmp(a,b){var da=parseDate(a.date),db=parseDate(b.date);if(da&&db) return da-db;if(da) return -1;if(db) return 1;return a.name.localeCompare(b.name);}
    function row(r){
      var name=r.name||r.Name;var theme=r.theme||r.Theme;
      if(!name||!theme) return null;
      var lat=parseFloat(r.lat||r.latitude),lng=parseFloat(r.lng||r.longitude);
      return {
        name:name, theme:theme,
        subtheme:r.subtheme||"",
        orgType:r.orgType||r.organisationType||r.orgtype||"",
        orgName:r.orgName||r.organisation||r.organization||"",
        date:r.date||"", time:r.time||"",
        venue:r.venue||"", address:r.address||"",
        lat:isNaN(lat)?null:lat, lng:isNaN(lng)?null:lng,
        url:r.url||r.website||"", description:r.description||""
      };
    }
    function ready(fn){if(window.L&&window.Papa) return fn();setTimeout(function(){ready(fn);},50);}

    // ---------- Map + popup ----------
    function icon(L,color,t){
      var ic = t && t.icon ? svgIcon(t.icon, "#fff", 18, 2.2) : "";
      var html = '<div style="width:36px;height:36px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;">'+ic+'</div>';
      return L.divIcon({className:"pal-marker",html:html,iconSize:[36,36],iconAnchor:[18,18]});
    }
    function popup(ev,t,org){
      var color=t?t.color:DEFAULT_COLOR;
      var tIcon = t && t.icon ? svgIcon(t.icon, "#fff", 11, 2.2) : "";
      var h='<div style="max-width:290px;color:#3c1b30;">';
      h+='<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#fff;background:'+color+';padding:3px 9px;border-radius:999px;font-weight:700;margin-bottom:8px;vertical-align:middle;">'+tIcon+esc(t?t.title:ev.theme)+'</span>';
      if(ev.subtheme){
        var sIcon = subthemeSvg(ev.subtheme, "#8a677a", 11);
        h+=' <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#8a677a;text-transform:uppercase;letter-spacing:.08em;font-weight:600;vertical-align:middle;">'+sIcon+esc(ev.subtheme)+'</span>';
      }
      h+='<strong style="font-size:16px;line-height:1.25;display:block;margin:4px 0;color:#60174C;">'+esc(ev.name)+'</strong>';
      if(org || ev.orgName){
        var oIcon = org && org.icon ? svgIcon(org.icon, org.color, 11, 2) : "";
        var parts = [];
        if(org) parts.push(esc(org.title));
        if(ev.orgName) parts.push(esc(ev.orgName));
        h+='<div style="font-size:11px;color:#8a677a;margin-top:2px;display:flex;align-items:center;gap:5px;">'+oIcon+'<span>'+parts.join(" · ")+'</span></div>';
      }
      var dl=[ev.date,ev.time].filter(Boolean).join(" · ");
      if(dl) h+='<div style="font-size:12px;color:#60174C;font-weight:600;margin-top:6px;">'+esc(dl)+'</div>';
      var where=[ev.venue,ev.address].filter(Boolean).join(", ");
      if(where) h+='<div style="font-size:12px;color:#8a677a;margin-top:2px;">'+esc(where)+'</div>';
      if(ev.description) h+='<p style="font-size:13px;line-height:1.5;color:#3c1b30;margin:10px 0 8px;">'+esc(ev.description)+'</p>';
      if(ev.url) h+='<a href="'+esc(ev.url)+'" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#cf2028;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;">Learn more &rarr;</a>';
      return h+"</div>";
    }

    // ---------- Bootstrap ----------
    function boot(allEvents){
      var themeById={};THEMES.forEach(function(t){themeById[t.id]=t;});
      var orgById={};ORG_TYPES.forEach(function(o){orgById[o.id]=o;});
      allEvents.forEach(function(e,i){e.__idx=i;});

      var L=window.L;
      var map=L.map("pal-map",{scrollWheelZoom:false}).setView([-41.1350,174.8400],12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors",maxZoom:19}).addTo(map);
      var layer=L.layerGroup().addTo(map);
      var markers={};
      var state={themes:new Set(),orgs:new Set()};

      function matches(ev){
        if(state.themes.size && !state.themes.has(ev.theme)) return false;
        if(state.orgs.size && !state.orgs.has(ev.orgType)) return false;
        return true;
      }

      function populateMap(evs){
        layer.clearLayers(); markers={};
        var bounds=[];
        evs.forEach(function(ev){
          if(ev.lat==null||ev.lng==null) return;
          var t=themeById[ev.theme],org=orgById[ev.orgType];
          var color=t?t.color:DEFAULT_COLOR;
          var m=L.marker([ev.lat,ev.lng],{icon:icon(L,color,t)}).bindPopup(popup(ev,t,org),{maxWidth:310});
          layer.addLayer(m); markers[ev.__idx]=m; bounds.push([ev.lat,ev.lng]);
        });
        if(bounds.length>1) map.fitBounds(bounds,{padding:[24,24],maxZoom:14});
        else if(bounds.length===1) map.setView(bounds[0],14);
        else map.setView([-41.1350,174.8400],12);
      }

      function chip(item, stateSet){
        var b=document.createElement("button"); b.type="button";
        b.className="pal-filter-chip";
        var active=stateSet.has(item.id);
        if(active){ b.classList.add("pal-active"); b.style.background=item.color; b.style.borderColor=item.color; }
        var iconColor = active ? "#fff" : item.color;
        b.innerHTML='<span class="pal-filter-chip-icon">'+svgIcon(item.icon, iconColor, 14, 2)+'</span><span>'+esc(item.title)+'</span>';
        b.onclick=function(){ if(stateSet.has(item.id)) stateSet.delete(item.id); else stateSet.add(item.id); refresh(); };
        return b;
      }

      function renderFilters(){
        var root=document.getElementById("pal-filters"); root.innerHTML="";
        function bar(label, items, stateSet){
          var wrap=document.createElement("div"); wrap.className="pal-filter-bar";
          var lb=document.createElement("span"); lb.className="pal-filter-label"; lb.textContent=label; wrap.appendChild(lb);
          var chips=document.createElement("div"); chips.className="pal-filter-chips";
          items.forEach(function(it){ chips.appendChild(chip(it, stateSet)); });
          wrap.appendChild(chips); return wrap;
        }
        root.appendChild(bar("Filter by recommendation", THEMES, state.themes));
        root.appendChild(bar("Filter by organisation", ORG_TYPES, state.orgs));
        if(state.themes.size + state.orgs.size > 0){
          var clr=document.createElement("button"); clr.type="button"; clr.className="pal-filter-clear";
          clr.textContent="Clear all filters";
          clr.onclick=function(){ state.themes.clear(); state.orgs.clear(); refresh(); };
          root.appendChild(clr);
        }
      }

      function renderThemes(grouped, hiddenThemes){
        var root=document.getElementById("pal-themes"); root.innerHTML="";
        THEMES.forEach(function(t){
          if(hiddenThemes && hiddenThemes.has(t.id)) return;
          var evs=grouped[t.id]||[];
          var card=document.createElement("article"); card.className="pal-card"; card.id="pal-theme-"+slug(t.id);
          var badge = t.icon ? '<div class="pal-badge" style="background:'+t.color+'">'+svgIcon(t.icon,"#fff",22,2)+'</div>' : '';
          var head='<div class="pal-head" style="border-left-color:'+t.color+'">'
               +'<span class="pal-count">'+evs.length+' event'+(evs.length===1?"":"s")+'</span>'
               +badge
               +'<div class="pal-head-text">'
               +'<h3>'+esc(t.title)+'</h3>'
               +'<div class="pal-sub">'+esc(t.subtitle||"")+'</div>'
               +(t.description?'<p>'+esc(t.description)+'</p>':"")
               +'</div></div>';
          var list;
          if(!evs.length){ list='<ul class="pal-events pal-empty"><li>No events match the current filters.</li></ul>'; }
          else{
            list='<ul class="pal-events">';
            evs.forEach(function(ev){
              var d=dateParts(ev.date);
              var meta=[ev.time,ev.venue,ev.address].filter(Boolean).map(esc).join(" · ");
              var org=orgById[ev.orgType];
              list+='<li data-event-index="'+ev.__idx+'">';
              list+='<div class="pal-date"><span class="pal-day">'+esc(d.day)+'</span><span class="pal-mon">'+esc(d.mon)+'</span><span class="pal-yr">'+esc(d.yr)+'</span></div>';
              list+='<div>';
              if(ev.subtheme){
                var sp = subthemeSvg(ev.subtheme, "#fff", 11);
                list+='<span class="pal-pill" style="background:'+t.color+'">'+(sp?'<span class="pal-pill-icon">'+sp+'</span>':'')+esc(ev.subtheme)+'</span>';
              }
              if(org){
                list+='<span class="pal-pill" style="background:'+org.color+'"><span class="pal-pill-icon">'+svgIcon(org.icon,"#fff",11,2)+'</span>'+esc(org.title)+'</span>';
              }
              list+='<span class="pal-title">'+esc(ev.name)+'</span>';
              if(ev.orgName) list+='<div class="pal-meta pal-org-name">'+esc(ev.orgName)+'</div>';
              if(meta) list+='<div class="pal-meta">'+meta+'</div>';
              if(ev.description) list+='<div class="pal-desc">'+esc(ev.description)+'</div>';
              if(ev.url) list+='<div class="pal-meta" style="margin-top:4px;"><a class="pal-link" href="'+esc(ev.url)+'" target="_blank" rel="noopener">Learn more &rarr;</a></div>';
              list+='</div><div class="pal-chev">&rsaquo;</div></li>';
            });
            list+='</ul>';
          }
          card.innerHTML=head+list;
          root.appendChild(card);
        });
        root.onclick=function(e){
          var li=e.target.closest("li[data-event-index]"); if(!li) return;
          var idx=parseInt(li.getAttribute("data-event-index"),10);
          var m=markers[idx]; if(!m) return;
          map.setView(m.getLatLng(),15,{animate:true});
          setTimeout(function(){m.openPopup();},250);
          document.getElementById("pal-map").scrollIntoView({behavior:"smooth",block:"start"});
        };
      }

      function setStatus(visible,total){
        var el=document.getElementById("pal-status");
        if(!total){ el.textContent="No events to display."; return; }
        var parts=[];
        if(visible===total) parts.push("Showing all "+total+" event"+(total===1?"":"s"));
        else parts.push("Showing "+visible+" of "+total+" events");
        var filters=[];
        if(state.themes.size) filters.push(state.themes.size+" recommendation"+(state.themes.size===1?"":"s"));
        if(state.orgs.size) filters.push(state.orgs.size+" organisation type"+(state.orgs.size===1?"":"s"));
        if(filters.length) parts.push("filtered by "+filters.join(" and "));
        el.textContent=parts.join(" — ")+".";
      }

      function refresh(){
        var visible=allEvents.filter(matches);
        var grouped={};THEMES.forEach(function(t){grouped[t.id]=[];});
        visible.forEach(function(e){ if(grouped[e.theme]) grouped[e.theme].push(e); });
        Object.keys(grouped).forEach(function(k){grouped[k].sort(cmp);});
        var hidden=null;
        if(state.themes.size){ hidden=new Set(); THEMES.forEach(function(t){ if(!state.themes.has(t.id)) hidden.add(t.id); }); }
        populateMap(visible);
        renderFilters();
        renderThemes(grouped, hidden);
        setStatus(visible.length, allEvents.length);
      }

      refresh();
    }

    ready(function(){
      if(!GOOGLE_SHEET_CSV_URL){
        document.getElementById("pal-status").textContent="Add a Google Sheet URL in the snippet to load events.";
        return boot([]);
      }
      Papa.parse(GOOGLE_SHEET_CSV_URL,{download:true,header:true,skipEmptyLines:true,
        complete:function(r){boot((r.data||[]).map(row).filter(Boolean));},
        error:function(err){console.error("[porirua-map]",err);document.getElementById("pal-status").textContent="Failed to load events.";boot([]);}
      });
    });
  })();
</script>
