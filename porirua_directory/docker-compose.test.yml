# Disposable Postgres for directory integration tests.
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:db
#   docker compose -f docker-compose.test.yml down
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porirua
      POSTGRES_PASSWORD: porirua
      POSTGRES_DB: porirua_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porirua -d porirua_test"]
      interval: 2s
      timeout: 5s
      retries: 15
