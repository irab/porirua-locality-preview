server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json text/css application/javascript text/plain;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|html|json)$ {
    add_header Cache-Control "public, max-age=300";
  }
}
